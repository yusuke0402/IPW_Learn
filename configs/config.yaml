# =============================
# 実験設定ファイル
# =============================

scenario:
  data_scenario_id: "data_scenario_1"
  model_id: "linear"
  model_scenario_id: "model_scenario_1"

hyperparameters:
    alpha: 1
    n_trial: 300
    n_bootstraps: 1000   # full-pipeline bootstrap の反復数(0 で点推定のみ)
    n_jobs: "auto"       # "auto" = min(CPU-2, 8)、-1 = 全コア
    n_features: 10
    # 重みの種類: uniform / propensity / ulsif / oracle (weight.py 参照)
    weight_method: "propensity"
    # propensity 系のロジスティック回帰の罰則: "l2"(sklearn 既定、強さ propensity_C。PSS-Learn と同じ) / "none"(最尤)
    propensity_penalty: "l2"
    propensity_C: 1.0

dataset:
    target_number: 20
    source_number: 20
    true_value: 0.0

output_dir: "no_difference_10dim_results"
