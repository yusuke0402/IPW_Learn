# =============================
# 実験設定ファイル
# =============================

scenario:
  data_scenario_id: "data_scenario_1"
  model_id: "linear"
  model_scenario_id: "model_scenario_1"

hyperparameters:
    # Original-sample ESS only. Bootstrap requires >= design-column count positive-weight rows.
    min_ess: 3.0
    # CI is missing when failed bootstrap proportion exceeds this value.
    max_bootstrap_failure_rate: 0.05
    alpha: 1
    n_trial: 300
    n_bootstraps: 1000   # full-pipeline bootstrap の反復数(0 で点推定のみ)
    n_jobs: "auto"       # "auto" = min(CPU-2, 8)、-1 = 全コア
    n_features: 10
    # 重みの種類: uniform / propensity / ulsif / oracle (weight.py 参照)
    weight_method: "propensity"
    # Logistic membership: stratified CV chooses C for "l2"; "none" disables the penalty.
    propensity_penalty: "l2"
    propensity_C: 1.0
    propensity_cv: true
    propensity_C_grid: null  # 1e-4..1e4, 17 log-spaced values
    propensity_cv_folds: 5

dataset:
    target_number: 20
    source_number: 20
    true_value: 0.0

output_dir: "no_difference_10dim_results"
